name: Set up Java and Gradle
description: Installs the project JDK and configures Gradle with dependency caching

runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: 25
        distribution: corretto

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
