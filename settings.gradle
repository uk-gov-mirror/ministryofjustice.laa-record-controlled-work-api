pluginManagement {
    repositories {
        mavenCentral()
        maven { url = "https://plugins.gradle.org/m2/" }
        gradlePluginPortal()
    }

    plugins {
        id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin' version '3.1.4'
        id 'org.openapi.generator' version '7.27.0'
        id 'io.freefair.lombok' version '9.8.3'
    }
}

rootProject.name = 'laa-record-controlled-work-api'

include 'record-controlled-work-api'
include 'record-controlled-work-service'

